name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install gdtoolkit
        run: pip install gdtoolkit==4.5.0
      - name: Check formatting
        run: gdformat --check .
      - name: Lint
        run: gdlint .

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Import project
        run: godot --headless --import
      - name: Run gdUnit4
        run: >-
          ./addons/gdUnit4/runtest.sh --godot_binary "$(command -v godot)"
          --headless --ignoreHeadlessMode -a res://test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: reports/
          if-no-files-found: ignore

  export:
    name: Export ${{ matrix.name }}
    needs: [lint, test]
    runs-on: ubuntu-24.04
    container: barichello/godot-ci:4.7.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            preset: Windows Desktop
            path: build/windows/LineTowerWars.exe
          - name: Linux
            preset: Linux
            path: build/linux/LineTowerWars.x86_64
          - name: macOS
            preset: macOS
            path: build/macos/LineTowerWars.zip
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      # The image installs templates under /root, but Actions sets HOME to /github/home.
      - name: Move export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import project
        run: godot --headless --import
      - name: Export
        run: |
          mkdir -p "$(dirname "${{ matrix.path }}")"
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.path }}"
          test -f "${{ matrix.path }}"
      - uses: actions/upload-artifact@v7
        with:
          name: LineTowerWars-${{ matrix.name }}
          path: build/
